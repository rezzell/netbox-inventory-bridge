{{- range $component := list "agent" "companion" }}
{{- $settings := index $.Values $component }}
{{- if $settings.enabled }}
{{- $name := printf "%s-%s" (include "inventory.name" $) $component }}
---
apiVersion: apps/v1
kind: {{ if eq $component "agent" }}DaemonSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ $name }}
  labels:
    {{- include "inventory.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if eq $component "companion" }}
  replicas: 1
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "inventory.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include "inventory.config" (dict "root" $ "component" $component) | sha256sum }}
        {{- if and (eq $component "agent") $.Values.openshift.enabled }}
        openshift.io/required-scc: {{ include "inventory.name" $ }}-agent
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: {{ eq $component "companion" }}
      hostNetwork: false
      hostPID: false
      hostIPC: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- $selector := mergeOverwrite (deepCopy $settings.nodeSelector) (dict "kubernetes.io/os" "linux") }}
        {{- toYaml $selector | nindent 8 }}
      {{- with $settings.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- if eq $component "agent" }}
        runAsUser: 0
        {{- else }}
        runAsNonRoot: true
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $component }}
          image: {{ printf "%s%s" $settings.image.repository (ternary (printf "@%s" $settings.image.digest) (printf ":%s" $settings.image.tag) (ne $settings.image.digest "")) | quote }}
          imagePullPolicy: {{ $settings.image.pullPolicy }}
          command: [python3, /opt/inventory/{{ $component }}.py]
          args: [--config, /etc/inventory/config.json]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            {{- if eq $component "agent" }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/inventory
              readOnly: true
            {{- if $settings.sourceConfigMap }}
            - name: source
              mountPath: /opt/inventory
              readOnly: true
            {{- end }}
            {{- if $settings.credentials.existingSecret }}
            - name: netbox-token
              mountPath: /run/netbox
              readOnly: true
            {{- end }}
            {{- if eq $component "agent" }}
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
              recursiveReadOnly: Enabled
              mountPropagation: None
            {{- range $file := list "cpuinfo" "meminfo" "os-release" }}
            - name: host-{{ $file }}
              mountPath: /host/{{ if eq $file "os-release" }}etc{{ else }}proc{{ end }}/{{ $file }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        {{- if $settings.sourceConfigMap }}
        - name: source
          configMap:
            name: {{ $settings.sourceConfigMap | quote }}
        {{- end }}
        {{- if $settings.credentials.existingSecret }}
        - name: netbox-token
          secret:
            secretName: {{ $settings.credentials.existingSecret | quote }}
            items:
              - key: {{ $settings.credentials.key | quote }}
                path: token
        {{- end }}
        {{- if eq $component "agent" }}
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        {{- range $file := list "cpuinfo" "meminfo" "os-release" }}
        - name: host-{{ $file }}
          hostPath:
            path: /{{ if eq $file "os-release" }}etc{{ else }}proc{{ end }}/{{ $file }}
            type: File
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
