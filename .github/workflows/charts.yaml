name: Validate and publish Helm charts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.2
      - run: |
          python3 -m unittest discover -s apps/node-hardware-inventory/tests -q
          python3 -m unittest discover -s apps/node-hardware-inventory/activation -p 'test_*.py' -q
          python3 -m unittest discover -s charts/netbox-node-inventory/tests -q
          helm lint charts/netbox-node-inventory --set clusterId=example-cluster
          python3 -m unittest discover -s scripts -p 'test_*.py' -q
          python3 scripts/build-chart-repository.py --output dist --url https://rezzell.github.io/netbox-inventory-bridge/
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 apps/node-hardware-inventory/tests/integration/run.py
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.2
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: python3 scripts/build-chart-repository.py --output dist --url https://rezzell.github.io/netbox-inventory-bridge/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Deploy chart repository
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
